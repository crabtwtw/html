<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>給侯憶盛的生日禮物 🎁</title>
<meta property="og:title" content="給侯憶盛的生日禮物 🎁">
<meta property="og:description" content="點開來看看，裡面有東西等你拆。">
<meta name="theme-color" content="#1C2547">
<style>
  :root{
    --sky1:#1C2547; --sky2:#43407E;
    --ribbon:#FF7E9D; --ribbon-d:#E9637F;
    --pearl:#FFF8F2; --pearl-d:#F1E2DA;
    --aqua:#A9DDE7; --aqua-l:#C9EDF2; --aqua-d:#7FBFCC;
    --ink:#22264A;
    --S:170px; --H:130px; --L:186px; --LH:38px;
    --PW:124px; --PH:254px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--sky1);color-scheme:dark}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:radial-gradient(120% 80% at 50% 20%,var(--sky2) 0%,var(--sky1) 70%);
    color:#fff;-webkit-user-select:none;user-select:none;
  }
  #stars{position:fixed;inset:0;pointer-events:none}
  .star{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
  @keyframes tw{50%{opacity:.25}}

  header{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 28px) 24px 0;text-align:center;z-index:5;transition:opacity .6s,transform .6s}
  header h1{font-size:26px;font-weight:700;letter-spacing:.06em}
  header p{margin-top:8px;font-size:15px;opacity:.75}
  #hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);text-align:center;font-size:16px;z-index:5;transition:opacity .5s}
  #hint span{display:inline-block;padding:12px 22px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.06)}}
  .hide{opacity:0!important;pointer-events:none}

  #stage{position:fixed;inset:0;perspective:900px;touch-action:none;cursor:pointer}
  #world{position:absolute;left:50%;top:52%;transform-style:preserve-3d;transform:rotateX(-16deg)}
  .p3d{position:absolute;left:0;top:0;transform-style:preserve-3d}

  /* box wrappers */
  #wrap{transition:transform 1.1s cubic-bezier(.6,0,.8,.4)}
  #wrap.gone{transform:translateY(520px) scale(.7)}
  #float{animation:float 3.2s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-12px)}}
  #shake.shake{animation:shake .5s ease-in-out}
  @keyframes shake{
    0%,100%{transform:rotateZ(0)}20%{transform:rotateZ(-8deg) scale(1.05)}
    40%{transform:rotateZ(7deg)}60%{transform:rotateZ(-5deg) scale(1.08)}80%{transform:rotateZ(3deg)}
  }
  #spin{animation:spin 12s linear infinite}
  @keyframes spin{to{transform:rotateY(360deg)}}

  .face{position:absolute;left:0;top:0}
  .side{
    width:var(--S);height:var(--H);margin:calc(var(--H) / -2) 0 0 calc(var(--S) / -2);
    background:
      linear-gradient(90deg,transparent 42%,var(--ribbon) 42%,var(--ribbon) 58%,transparent 58%),
      linear-gradient(180deg,var(--pearl),var(--pearl-d));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);
  }
  .b-front{transform:translateZ(calc(var(--S) / 2))}
  .b-back{transform:rotateY(180deg) translateZ(calc(var(--S) / 2))}
  .b-left{transform:rotateY(-90deg) translateZ(calc(var(--S) / 2));filter:brightness(.9)}
  .b-right{transform:rotateY(90deg) translateZ(calc(var(--S) / 2));filter:brightness(.9)}
  .b-bottom{width:var(--S);height:var(--S);margin:calc(var(--S) / -2) 0 0 calc(var(--S) / -2);background:var(--pearl-d);transform:rotateX(-90deg) translateZ(calc(var(--H) / 2))}
  .b-floor{width:var(--S);height:var(--S);margin:calc(var(--S) / -2) 0 0 calc(var(--S) / -2);
    background:radial-gradient(circle,#FFE7A8 0%,#F4B8C6 60%,#C98BA0 100%);transform:rotateX(90deg) translateZ(calc(var(--H) / -2 + 3px))}

  #lid{transform:translateY(calc(var(--H) / -2 - var(--LH) / 2 + 2px));transition:transform 1.1s cubic-bezier(.2,.7,.3,1)}
  #lid.off{transform:translateY(calc(var(--H) / -2 - var(--LH) / 2)) translate3d(60px,-460px,80px) rotateX(-80deg) rotateZ(35deg)}
  .lside{
    width:var(--L);height:var(--LH);margin:calc(var(--LH) / -2) 0 0 calc(var(--L) / -2);
    background:
      linear-gradient(90deg,transparent 42%,var(--ribbon-d) 42%,var(--ribbon-d) 58%,transparent 58%),
      linear-gradient(180deg,#fff,var(--pearl));
  }
  .l-front{transform:translateZ(calc(var(--L) / 2))}
  .l-back{transform:rotateY(180deg) translateZ(calc(var(--L) / 2))}
  .l-left{transform:rotateY(-90deg) translateZ(calc(var(--L) / 2));filter:brightness(.92)}
  .l-right{transform:rotateY(90deg) translateZ(calc(var(--L) / 2));filter:brightness(.92)}
  .l-top{
    width:var(--L);height:var(--L);margin:calc(var(--L) / -2) 0 0 calc(var(--L) / -2);
    background:
      linear-gradient(90deg,transparent 42%,var(--ribbon) 42%,var(--ribbon) 58%,transparent 58%),
      linear-gradient(0deg,transparent 42%,var(--ribbon) 42%,var(--ribbon) 58%,transparent 58%),
      #fff;
    transform:rotateX(90deg) translateZ(calc(var(--LH) / 2));
  }
  .l-under{width:var(--L);height:var(--L);margin:calc(var(--L) / -2) 0 0 calc(var(--L) / -2);background:var(--pearl-d);transform:rotateX(-90deg) translateZ(calc(var(--LH) / 2))}
  .bow{transform:translateY(calc(var(--LH) / -2))}
  .bowplane{transform-style:preserve-3d}
  .loop{position:absolute;width:62px;height:44px;border:11px solid var(--ribbon);border-radius:50%;bottom:-6px}
  .loop.l{right:2px;transform:rotate(-22deg);transform-origin:right bottom}
  .loop.r{left:2px;transform:rotate(22deg);transform-origin:left bottom}
  .knot{position:absolute;width:22px;height:20px;left:-11px;top:-16px;border-radius:7px;background:var(--ribbon-d)}

  #burst{position:absolute;left:-200px;top:-260px;width:400px;height:400px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,240,200,.95) 0%,rgba(255,200,220,.5) 30%,transparent 65%);
    transform:scale(0);opacity:0;pointer-events:none}
  #burst.go{animation:burst 1.4s ease-out forwards}
  @keyframes burst{0%{transform:scale(.2);opacity:1}100%{transform:scale(2.4);opacity:0}}

  /* phone */
  #phone{visibility:hidden}
  .pl{position:absolute;width:var(--PW);height:var(--PH);left:calc(var(--PW) / -2);top:calc(var(--PH) / -2);border-radius:26px;background:var(--aqua-d)}
  .p-front,.p-back{backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .p-front{background:#0A0D16;padding:4px;box-shadow:0 0 0 1.5px var(--aqua-d)}
  .screen{width:100%;height:100%;border-radius:22px;overflow:hidden;position:relative;
    background:radial-gradient(90% 60% at 30% 20%,#FFC9D6 0%,transparent 60%),radial-gradient(90% 70% at 80% 85%,#9EE3EC 0%,transparent 60%),linear-gradient(180deg,#5E5AA8,#2E3A76);
    display:flex;flex-direction:column;align-items:center;color:#fff}
  .island{width:38px;height:11px;border-radius:999px;background:#000;margin-top:8px}
  .s-date{margin-top:22px;font-size:10px;opacity:.85}
  .s-time{font-size:46px;font-weight:600;line-height:1;margin-top:2px;letter-spacing:-.02em}
  .s-note{margin-top:auto;margin-bottom:18px;font-size:11px;padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .p-back{background:linear-gradient(155deg,var(--aqua-l) 0%,var(--aqua) 55%,#93CFDB 100%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
  .cam{position:absolute;left:10px;top:10px;width:58px;height:58px;border-radius:18px;
    background:linear-gradient(145deg,#BFE6EE,#93CDD9);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 2px 6px rgba(40,90,110,.25)}
  .lens{position:absolute;width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#4A5E7A 0%,#11151F 45%,#05070B 70%);box-shadow:0 0 0 3px #A6D5DF,0 0 0 4px rgba(0,0,0,.15)}
  .lens.a{left:6px;top:6px}.lens.b{left:6px;top:31px}.lens.c{left:31px;top:18px}
  .flash{position:absolute;right:6px;top:5px;width:7px;height:7px;border-radius:50%;background:#FFF6DA}
  .engrave{position:absolute;left:0;right:0;top:50%;transform:translateY(-30%);text-align:center;font-size:24px;font-weight:700;line-height:1.15;letter-spacing:.04em;color:rgba(30,75,90,.72);text-shadow:0 1px 0 rgba(255,255,255,.55)}
  .engrave span{display:block;font-size:14px;letter-spacing:.2em;margin-bottom:2px}

  /* ticket */
  #card{position:fixed;left:50%;bottom:0;z-index:6;width:min(92vw,380px);
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
    transform:translate(-50%,115%);transition:transform .9s cubic-bezier(.2,.9,.25,1.05);touch-action:auto}
  #card.show{transform:translate(-50%,0)}
  .ticket{background:#FFFBF6;color:var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35);max-height:62vh;overflow-y:auto}
  .t-top{padding:20px 22px 16px;background:linear-gradient(135deg,var(--aqua-l),#E7F6F8 60%,#FFE9EF)}
  .t-hi{font-size:14px;color:#3B6F7C}
  .t-title{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.01em;margin-top:6px}
  .t-desc{font-size:14px;line-height:1.65;margin-top:10px;color:#3A3F63}
  .t-perf{height:22px;position:relative;background:#FFFBF6}
  .t-perf::before{content:"";position:absolute;left:18px;right:18px;top:10px;border-top:2px dashed #E3D6CE}
  .t-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:0 22px 16px}
  .t-meta dt{font-size:12px;color:#8A8299}
  .t-meta dd{font-size:15px;font-weight:600;margin-top:2px}
  .t-actions{display:flex;gap:10px;padding:0 22px 20px}
  .t-actions button{flex:1;font:inherit;font-size:16px;font-weight:600;border:0;border-radius:14px;padding:13px 0;cursor:pointer}
  #accept{background:var(--ribbon);color:#fff}
  #accept.done{background:#5FAFBF}
  #replay{flex:.6;background:#EFE7E2;color:var(--ink)}
  button:focus-visible{outline:3px solid #5FAFBF;outline-offset:2px}

  #fx{position:fixed;inset:0;pointer-events:none;z-index:7}
  @media (prefers-reduced-motion:reduce){#float,#spin,.star,#hint span{animation:none}}
</style>
</head>
<body>
<div id="stars"></div>

<header id="head">
  <h1>生日快樂 <span id="toHead">小豬婆</span></h1>
  <p>有一份禮物在等你</p>
</header>

<div id="stage">
  <div id="world" class="p3d">
    <div id="burst"></div>

    <div id="wrap" class="p3d"><div id="float" class="p3d"><div id="shake" class="p3d"><div id="spin" class="p3d">
      <div class="face side b-front"></div>
      <div class="face side b-back"></div>
      <div class="face side b-left"></div>
      <div class="face side b-right"></div>
      <div class="face b-bottom"></div>
      <div class="face b-floor"></div>
      <div id="lid" class="p3d">
        <div class="face l-top"></div>
        <div class="face l-under"></div>
        <div class="face lside l-front"></div>
        <div class="face lside l-back"></div>
        <div class="face lside l-left"></div>
        <div class="face lside l-right"></div>
        <div class="bow p3d">
          <div class="bowplane p3d" style="transform:rotateY(45deg)"><div class="loop l"></div><div class="loop r"></div><div class="knot"></div></div>
          <div class="bowplane p3d" style="transform:rotateY(-45deg)"><div class="loop l"></div><div class="loop r"></div><div class="knot"></div></div>
        </div>
      </div>
    </div></div></div></div>

    <div id="phone" class="p3d"></div>
  </div>
</div>

<div id="hint"><span>點一下禮物盒，打開它</span></div>

<div id="card">
  <div class="ticket">
    <div class="t-top">
      <p class="t-hi">給 <span class="v-to">小豬婆</span> 的生日禮物</p>
      <h2 class="t-title">iPhone 19<br>提領券</h2>
      <p class="t-desc">憑這張券，明年可以兌換一支 iPhone 19。顏色就照今年你喜歡的水藍色，想換別的顏色也可以，你說了算。</p>
    </div>
    <div class="t-perf"></div>
    <dl class="t-meta">
      <div><dt>持券人</dt><dd class="v-to">小豬婆</dd></div>
      <div><dt>發券人</dt><dd id="vFrom">小豬公</dd></div>
      <div><dt>兌換期限</dt><dd id="vExpire">2027 新機開賣日</dd></div>
      <div><dt>券號</dt><dd id="vNo">No. 20261028</dd></div>
    </dl>
    <div class="t-actions">
      <button id="accept">收下禮物</button>
      <button id="replay">再拆一次</button>
    </div>
  </div>
</div>

<canvas id="fx"></canvas>

<script>
/* ====== 在這裡改成你們的資料 ====== */
const CONFIG = {
  to: "小豬婆",                 // 她的名字或暱稱
  from: "小豬公",            // 你的名字
  expire: "2027 新機開賣日",    // 兌換期限
  serial: "No. 20261028",      // 券號（可以放她的生日）
  screenDate: "10月28日 星期三", // 手機鎖定畫面的日期
  screenTime: "10:28",          // 手機鎖定畫面的時間
  screenNote: "生日快樂 🎂"
};
/* ================================= */

document.getElementById("toHead").textContent = CONFIG.to;
document.querySelectorAll(".v-to").forEach(e => e.textContent = CONFIG.to);
document.getElementById("vFrom").textContent = CONFIG.from;
document.getElementById("vExpire").textContent = CONFIG.expire;
document.getElementById("vNo").textContent = CONFIG.serial;

// stars
const starBox = document.getElementById("stars");
for (let i = 0; i < 70; i++) {
  const s = document.createElement("div");
  const z = Math.random() * 2 + 1;
  s.className = "star";
  s.style.cssText = `width:${z}px;height:${z}px;left:${Math.random()*100}%;top:${Math.random()*100}%;opacity:${Math.random()*.6+.3};animation-delay:${Math.random()*3}s`;
  starBox.appendChild(s);
}

// build phone layers (thickness)
const phone = document.getElementById("phone");
const T = 10;
for (let i = 0; i < T; i++) {
  const l = document.createElement("div");
  l.className = "pl";
  l.style.transform = `translateZ(${i - T/2 + .5}px)`;
  l.style.background = i % 3 === 0 ? "#8ACAD6" : "var(--aqua-d)";
  phone.appendChild(l);
}
const back = document.createElement("div");
back.className = "pl p-back";
back.style.transform = `rotateY(180deg) translateZ(${T/2}px)`;
back.innerHTML = `<div class="cam"><div class="lens a"></div><div class="lens b"></div><div class="lens c"></div><div class="flash"></div></div><div class="engrave"><span>FOR</span>${CONFIG.to}</div>`;
phone.appendChild(back);
const front = document.createElement("div");
front.className = "pl p-front";
front.style.transform = `translateZ(${T/2}px)`;
front.innerHTML = `<div class="screen"><div class="island"></div><div class="s-date">${CONFIG.screenDate}</div><div class="s-time">${CONFIG.screenTime}</div><div class="s-note">${CONFIG.screenNote}</div></div>`;
phone.appendChild(front);

// phone motion
const st = { y: 30, ty: 30, s: .45, ts: .45, ry: 180, rx: 14, v: 0, vTarget: .5, drag: false };
function frame() {
  st.y += (st.ty - st.y) * .06;
  st.s += (st.ts - st.s) * .06;
  if (!st.drag) { st.v += (st.vTarget - st.v) * .02; st.ry += st.v; }
  phone.style.transform = `translate3d(0,${st.y}px,0) rotateX(${st.rx}deg) rotateY(${st.ry}deg) scale(${st.s})`;
  requestAnimationFrame(frame);
}
frame();

// open sequence
let opened = false;
const stage = document.getElementById("stage");
stage.addEventListener("click", () => {
  if (opened) return;
  opened = true;
  document.getElementById("hint").classList.add("hide");
  document.getElementById("shake").classList.add("shake");
  if (navigator.vibrate) navigator.vibrate(60);
  setTimeout(() => {
    document.getElementById("lid").classList.add("off");
    document.getElementById("burst").classList.add("go");
    confetti(160);
    phone.style.visibility = "visible";
    st.ty = -40; st.ts = 1; st.v = 16;
  }, 520);
  setTimeout(() => document.getElementById("wrap").classList.add("gone"), 1500);
  setTimeout(() => {
    document.getElementById("head").classList.add("hide");
    const card = document.getElementById("card");
    card.classList.add("show");
    placePhone();
  }, 2700);
});

function placePhone() {
  const card = document.getElementById("card");
  const h = innerHeight, free = h - card.offsetHeight - 10;
  st.ty = free / 2 - h * .52 + 6;
  st.ts = Math.min(1, (free * .8) / 254);
}
addEventListener("resize", () => { if (document.getElementById("card").classList.contains("show")) placePhone(); });

// drag to rotate phone
let lx = 0, ly = 0;
stage.addEventListener("pointerdown", e => { if (!opened) return; st.drag = true; lx = e.clientX; ly = e.clientY; });
addEventListener("pointermove", e => {
  if (!st.drag) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  st.ry += dx * .6; st.v = dx * .6;
  st.rx = Math.max(-35, Math.min(45, st.rx - dy * .3));
  lx = e.clientX; ly = e.clientY;
});
addEventListener("pointerup", () => { st.drag = false; });
addEventListener("pointercancel", () => { st.drag = false; });

// buttons
document.getElementById("accept").addEventListener("click", e => {
  const b = e.currentTarget;
  b.textContent = "已收下，明年見 📱";
  b.classList.add("done");
  confetti(220);
  st.v = 20;
});
document.getElementById("replay").addEventListener("click", () => location.reload());

// confetti
const cv = document.getElementById("fx"), cx = cv.getContext("2d");
let parts = [], running = false;
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
size(); addEventListener("resize", size);
const colors = ["#FF7E9D", "#A9DDE7", "#FFE08A", "#FFFFFF", "#C7B8FF", "#7FBFCC"];
function confetti(n) {
  const W = innerWidth, H = innerHeight;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 1.6, sp = 8 + Math.random() * 10;
    parts.push({ x: W / 2, y: H * .5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, w: 6 + Math.random() * 6, h: 4 + Math.random() * 6,
      c: colors[i % colors.length] });
  }
  if (!running) { running = true; tick(); }
}
function tick() {
  const d = devicePixelRatio;
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => {
    p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x * d, p.y * d); cx.rotate(p.r);
    cx.fillStyle = p.c; cx.fillRect(-p.w * d / 2, -p.h * d / 2, p.w * d, p.h * d * Math.abs(Math.cos(p.r * 2)));
    cx.restore();
  });
  parts = parts.filter(p => p.y < innerHeight + 40);
  if (parts.length) requestAnimationFrame(tick); else { running = false; cx.clearRect(0, 0, cv.width, cv.height); }
}
</script>
</body>
</html>
